version: '3.8'

services:
  opencanary:
    image: thinkst/opencanary:latest
    container_name: vyomrix-opencanary
    restart: always
    network_mode: "host" # Needs host networking to bind to real ports (21, 22, 80, 445)
    volumes:
      - ./config:/etc/opencanaryd
      - ./logs:/var/tmp
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

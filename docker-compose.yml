version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: vyorix-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vyorix-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: vyorix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyorix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyorix_secure_password_123!}
      POSTGRES_DB: ${POSTGRES_DB:-vyorix_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vyorix-network
    restart: unless-stopped
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: vyorix-redis
    networks:
      - vyorix-network
    restart: unless-stopped
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vyorix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - vyorix-network
    restart: unless-stopped
    ports:
      - "15672:15672" # Management UI
    expose:
      - "5672"

networks:
  vyorix-network:
    name: vyorix-network
    driver: bridge

volumes:
  postgres_data:

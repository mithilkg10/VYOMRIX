version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: vyorix-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vyorix-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: vyorix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyorix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyorix_password}
      POSTGRES_DB: ${POSTGRES_DB:-vyorix_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vyorix-network
    restart: unless-stopped
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: vyorix-redis
    networks:
      - vyorix-network
    restart: unless-stopped
    expose:
      - "6379"

  # frontend and backend will be uncommented once developed
  # backend:
  #   build: ./backend
  #   container_name: vyorix-backend
  #   ...
  # frontend:
  #   build: ./frontend
  #   container_name: vyorix-frontend
  #   ...

networks:
  vyorix-network:
    name: vyorix-network
    driver: bridge

volumes:
  postgres_data:

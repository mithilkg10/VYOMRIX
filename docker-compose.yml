version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: vyomrix-traefik
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vyomrix-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: vyomrix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vyomrix-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vyomrix-redis
    networks:
      - vyomrix-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vyomrix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS}
    networks:
      - vyomrix-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyomrix-backend
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB}
      - POSTGRES_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - vyomrix-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyomrix-frontend
    depends_on:
      - backend
    environment:
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - vyomrix-network
    restart: unless-stopped

networks:
  vyomrix-network:
    name: vyomrix-network
    driver: bridge

volumes:
  postgres_data:

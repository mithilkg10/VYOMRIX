title: Registry Run Key Persistence via reg.exe
id: 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e14
name: run_key_persistence
status: stable
description: A value added under a Run or RunOnce key from the command line.
author: Mithil K Gowda
date: 2026/10/08
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
      - ' add '
      - '\CurrentVersion\Run'
  condition: selection
falsepositives:
  - Legitimate installers
level: medium
tags:
  - attack.persistence
  - attack.t1547.001

title: Remote Admin Share Access
id: 9a0b1c2d-3e4f-4a5b-8c6d-7e8f9a0b1c09
name: admin_share_access
status: test
description: A network logon accessed the ADMIN$ or C$ share from another workstation.
author: Mithil K Gowda
date: 2026/10/06
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5140
    ShareName|endswith:
      - '\ADMIN$'
      - '\C$'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Software deployment tools
level: high
tags:
  - attack.lateral-movement
  - attack.t1021.002

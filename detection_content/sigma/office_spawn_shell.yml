title: Office Application Spawning a Script Interpreter
id: 6f1e1c39-91a1-4b44-9d8e-0c1f6a3c2a01
name: office_spawn_shell
status: stable
description: Detects Word, Excel or Outlook starting PowerShell, cmd, wscript, mshta or rundll32, a common pattern when a macro document runs its first stage.
author: Mithil K Gowda
date: 2026/10/02
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Rare business macros that call scripts; review the document origin
level: high
tags:
  - attack.initial-access
  - attack.execution
  - attack.t1566.001
  - attack.t1204.002

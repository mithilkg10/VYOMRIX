title: Password Spraying Against Windows Accounts
id: 3a4b5c6d-7e8f-4a9b-8c0d-1e2f3a4b5c18
name: win_password_spray
status: stable
description: One source address failing logons for six or more different accounts within ten minutes.
author: Mithil K Gowda
date: 2026/10/09
correlation:
  type: value_count
  rules:
    - win_failed_logon
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 6
level: high
tags:
  - attack.credential-access
  - attack.t1110.003

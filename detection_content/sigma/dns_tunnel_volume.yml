title: High Volume DNS Tunnelling to One Domain
id: 6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d31
name: dns_tunnel_volume
status: stable
description: Twenty or more long label queries from one host to the same parent domain within two minutes.
author: Mithil K Gowda
date: 2026/10/14
correlation:
  type: event_count
  rules:
    - dns_long_label
  group-by:
    - src_host
    - query_domain
  timespan: 2m
  condition:
    gte: 20
  generate: true
level: high
tags:
  - attack.exfiltration
  - attack.t1048.003

title: Domain Discovery Commands
id: 0e1f2a3b-4c5d-4e6f-8a7b-9c0d1e2f3a07
name: domain_discovery
status: stable
description: Enumeration of domain groups, users and controllers with net and nltest.
author: Mithil K Gowda
date: 2026/10/06
logsource:
  product: windows
  category: process_creation
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - ' group '
      - ' user '
    CommandLine|contains|all:
      - '/domain'
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains:
      - '/dclist'
      - '/domain_trusts'
  condition: 1 of selection_*
falsepositives:
  - Helpdesk staff checking group membership
level: medium
tags:
  - attack.discovery
  - attack.t1087.002

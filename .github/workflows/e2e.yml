name: Checkpoint 2 E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vyomrix
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: vyomrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx coverage

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Backend Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://vyomrix:testpassword@localhost:5432/vyomrix_test
          REDIS_HOST: localhost
          SECRET_KEY: test_secret_key_12345
        run: |
          alembic upgrade head

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://vyomrix:testpassword@localhost:5432/vyomrix_test
          REDIS_HOST: localhost
          SECRET_KEY: test_secret_key_12345
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=app

      - name: Start Backend Server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://vyomrix:testpassword@localhost:5432/vyomrix_test
          REDIS_HOST: localhost
          SECRET_KEY: test_secret_key_12345
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Build Next.js App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        run: |
          npm run start &
          sleep 5
          npm run e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

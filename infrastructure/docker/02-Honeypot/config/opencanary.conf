{
    "device.node_id": "vyomrix-honeypot-01",
    "ip.ignorelist": [],
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "file": {
                    "class": "logging.handlers.RotatingFileHandler",
                    "filename": "/var/tmp/opencanary.log",
                    "formatter": "plain",
                    "maxBytes": 10485760,
                    "backupCount": 5
                }
            }
        }
    },
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready.",
    
    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.41 (Ubuntu)",
    "http.skin": "nasLogin",
    
    "smb.enabled": true,
    "smb.auditfile": "/var/log/samba-audit.log",
    "smb.configfile": "/etc/samba/smb.conf",
    "smb.domain": "WORKGROUP",
    "smb.server_string": "Vyomrix File Server",
    
    "ssh.enabled": true,
    "ssh.port": 2222,
    "ssh.version": "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.1",
    
    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.31-0ubuntu0.18.04.1"
}

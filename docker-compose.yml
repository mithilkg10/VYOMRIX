version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: vyomrix-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vyomrix-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: vyomrix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyomrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyomrix_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vyomrix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vyomrix-network
    restart: unless-stopped
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: vyomrix-redis
    networks:
      - vyomrix-network
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vyomrix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - vyomrix-network
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyomrix-backend
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=vyomrix
      - POSTGRES_PASSWORD=vyomrix_secret
      - POSTGRES_DB=vyomrix
      - POSTGRES_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8000:8000"
    networks:
      - vyomrix-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyomrix-frontend
    depends_on:
      - backend
    environment:
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - vyomrix-network
    restart: unless-stopped

networks:
  vyomrix-network:
    name: vyomrix-network
    driver: bridge

volumes:
  postgres_data:
